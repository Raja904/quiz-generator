name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

env:
  REGISTRY: ghcr.io
  # Image name: ghcr.io/<owner>/pdf-to-quiz-backend
  IMAGE_NAME: ${{ github.repository_owner }}/pdf-to-quiz-backend

jobs:
  # ─── Job 1: Build Docker image and push to GHCR ───────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    outputs:
      # Pass the full image tag to the deploy job
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Auto-provided — no secret setup needed

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag with: latest + full commit SHA (e.g. sha-abc1234...)
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers via GitHub Actions cache — speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Deploy to Azure Web App ───────────────────────────────────────
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build # Only runs if build job succeeds
    environment:
      name: production

    steps:
      - name: Deploy container image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # GitHub Secrets required (set in: Settings → Secrets → Actions):
          #   AZURE_WEBAPP_NAME        — e.g. "pdf-to-quiz-api"
          #   AZURE_WEBAPP_PUBLISH_PROFILE — download from Azure Portal → Web App → Get publish profile
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
