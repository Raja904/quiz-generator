[project]
name = "pdf-to-quiz"
version = "0.1.0"
description = "AI-powered PDF Quiz Generator — Backend MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "litellm>=1.40.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langsmith[claude-agent-sdk]>=0.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0",
    "supabase>=2.5.0",
    # OCR: torch and torchvision are NOT listed here.
    # Reason: pyproject.toml cannot express index-URL-scoped version pins.
    # Listing "torch>=2.0.0" here would let uv pull the CUDA build (~2.5 GB)
    # from PyPI, exhausting Azure App Service's build disk.
    #
    # Instead:
    # - [tool.uv.sources] below pins torch/torchvision to the CPU-only index.
    # - easyocr declares torch/torchvision as its own deps; uv resolves them
    #   via [tool.uv.sources] automatically.
    # - requirements.txt also carries --extra-index-url + +cpu pins as a
    #   belt-and-suspenders fallback for plain pip environments.
    "easyocr>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["main.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── uv: CPU-only PyTorch ──────────────────────────────────────────────────────
# Azure Oryx uses uv to resolve dependencies from this file.
# Without this config, uv pulls torch from PyPI which defaults to the CUDA
# build (~2.5 GB) causing "No space left on device" during Oryx compression.
#
# How it works:
#   [[tool.uv.index]] registers the PyTorch CPU wheel server as a named index.
#   explicit = true means uv ONLY looks at this index for packages mapped to it
#   in [tool.uv.sources] — it will NOT fall back to PyPI for those packages.
#   This guarantees CPU-only wheels are resolved for torch and torchvision.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Map both packages exclusively to the CPU-only index.
# easyocr depends on both; uv resolves them through these sources automatically.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
