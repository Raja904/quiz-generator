[project]
name = "pdf-to-quiz"
version = "0.1.0"
description = "AI-powered PDF Quiz Generator — Backend MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "litellm>=1.40.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langsmith[claude-agent-sdk]>=0.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0",
    "supabase>=2.5.0",
    "rapidocr-onnxruntime>=1.3.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["main.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
